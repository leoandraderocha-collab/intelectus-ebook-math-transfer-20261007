name: package-ebook-assets
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ebook-math-assets
          path: |
            *.jpg
            *.webp
            *.png
          retention-days: 1
